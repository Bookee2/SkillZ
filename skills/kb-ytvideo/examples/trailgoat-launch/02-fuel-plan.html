<title>02 Build a fuel plan</title>
<style>
.rw{position:absolute;left:-402px;width:804px;height:84px}
.ic{position:absolute;left:0;top:10px;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.lb{position:absolute;left:88px;top:12px;font-size:30px;font-weight:600;color:var(--bright);white-space:nowrap}
.sk{position:absolute;left:88px;top:56px;height:12px;border-radius:6px;background:var(--line)}
.bar{position:absolute;right:0;top:30px;height:24px;border-radius:12px}
#btn{position:absolute;left:182px;top:596px;width:220px;height:68px;border-radius:34px;background:var(--accent);color:var(--accent-ink);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill"><div class="row" style="transform:translate(-50%,-50%);gap:16px;color:var(--accent-ink);font-size:44px;font-weight:700"><span id="icZap"></span>Build fuel plan</div></div>
  <div class="L" id="Lcard">
    <div class="row" style="left:-402px;top:44px;gap:16px"><span id="icPin"></span><span class="display" style="font-size:44px;color:var(--bright)">Wild Florida 50K</span></div>
    <div id="rows"></div>
    <div id="btn">Save plan</div>
  </div>
  <div class="L" id="Lsaved"><div class="row" style="transform:translate(-50%,-50%);gap:16px;color:var(--bright);font-size:44px;font-weight:700"><span id="icOk"></span>Plan saved</div></div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icZap').innerHTML=M.icon('zap',44,BRAND.accentInk,2.6);
$('icPin').innerHTML=M.icon('pin',44,BRAND.data.course,2.4);
$('icOk').innerHTML=M.icon('check',48,BRAND.data.crew,3);
// Illustrative: row labels are generic stops and bar lengths are relative, not real plan data.
const ROWS=[['Start','flag',BRAND.data.course,0.35],['Aid station 1','droplet',BRAND.data.aid,0.7],['Aid station 2','zap',BRAND.data.fuel,0.95],['Finish','flag',BRAND.data.crew,0.5]];
const T0=[1.85,2.3,2.75,3.2];
ROWS.forEach(([lb,ic,c],i)=>{$('rows').insertAdjacentHTML('beforeend',
 `<div class="rw" id="r${i}" style="top:${138+i*108}px"><div class="ic" style="background:${c}22">${M.icon(ic,34,c,2.4)}</div><div class="lb">${lb}</div><div class="sk" style="width:180px"></div><div class="bar" id="b${i}" style="background:${c}"></div></div>`);});
const grow=T0.map(t=>M.track(0,[[t+0.12,1,M.SOFT]]));
const btnPress=M.track(0,[[4.53,1,[45,1]],[4.635,0,[22,0.72]]]);
M.scene({
  W:1920,H:1080,T:6.4,intro:0.15,bg:BRAND.canvas,
  SH:{pill:{w:560,h:124,r:62,bg:BRAND.accent,cam:1.75}, card:{w:900,h:710,r:44,bg:BRAND.panel,cam:1.18}, saved:{w:440,h:124,r:62,bg:BRAND.panel,cam:1.8}},
  start:'pill', SEQ:[[1.3,'card'],[4.75,'saved']],
  shapePress:[1.2],
  layers:[
    {el:'Lpill',tin:0.15,tout:1.3},
    {el:'Lcard',tin:1.3,tout:4.75,anchor:'t',update:(t)=>{
      ROWS.forEach((r,i)=>{const v=M.vis(t,T0[i],null,{din:0,lin:0.22});M.apply($('r'+i),v);$('b'+i).style.width=(300*r[3]*grow[i](t)).toFixed(2)+'px';});
      $('btn').style.transform=`scale(${(1-0.06*btnPress(t)).toFixed(4)})`;}},
    {el:'Lsaved',tin:4.75,tout:null},
  ],
  cursor:{size:44,clicks:[1.2,4.6],keys:[[0,330,230],[0.5,330,230],[1.05,60,14],[1.5,60,14],[2.2,180,160],[3.9,180,160],[4.4,292,282],[4.8,292,282],[5.5,250,150]]},
});
</script>
